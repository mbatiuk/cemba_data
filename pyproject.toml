[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cemba_data"
version = "2.0.0"
description = "Single nucleus methylome and multi-omic mapping pipeline with hisat3n"
license = {text = "MIT"}
authors = [
    {name = "Hanqing Liu", email = "hanliu@salk.edu"},
    {name = "Wubin Ding", email = "wding@salk.edu"},
]
maintainers = [
    {name = "Mykhailo Batiuk", email = "mykhailo.batiuk@protonmail.ch"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/mbatiuk/cemba_data"
Source = "https://github.com/mbatiuk/cemba_data"

[project.scripts]
yap = "cemba_data.__main__:main"

[tool.setuptools.packages.find]
exclude = ["doc"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.tsv", "*.csv", "*.fa", "*Snakefile", "*.ipynb", "*.smk", "*.ini"]
